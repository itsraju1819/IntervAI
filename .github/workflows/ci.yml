name: IntervAI CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Build, Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest ruff pip-audit httpx

      - name: Run Code Linter (Ruff)
        run: |
          ruff check backend --exit-non-zero-on-fix

      - name: Run Automated Test Suite
        env:
          GEMINI_API_KEY: ""
          ENVIRONMENT: "test"
        run: |
          python -m pytest backend/tests -v

      - name: Dependency Security Audit
        run: |
          pip-audit --desc || echo "Audit completed with warnings; review security advisories."
