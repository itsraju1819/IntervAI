[project]
name = "intervai"
version = "1.0.0"
description = "Adaptive AI Mock Interview Platform with deterministic FSM, speech delivery metrics, and STAR evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::starlette.testclient.StarletteDeprecationWarning",
    "ignore::DeprecationWarning:google.genai.*"
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]
